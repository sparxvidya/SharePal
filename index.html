          --card: #171b25;
          --ink: #f3f4f8;
          --mute: #9aa1b2;
          --line: #262c3a;
          --acc2: #2a1b12;

      }

        --bg: #0e1118;
        --card: #171b25;
        --ink: #f3f4f8;
        --mute: #9aa1b2;
        --line: #262c3a;
        --acc2: #2a1b12;
        --chip: #202636;

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .hd {
        max-width: 1200px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
      }
      .logo {
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.5px;
      }
      .logo b {
        color: var(--acc);
      }
      .search {
        flex: 1;
        max-width: 520px;
        position: relative;
      }
      .search input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        transition: 0.2s;
      }
      .search input:focus {
        outline: none;
        border-color: var(--acc);
        box-shadow: 0 0 0 3px var(--acc2);
      }
      .city,
      .ic {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 10px;
        padding: 9px 12px;
        font: 600 13px Inter;
        cursor: pointer;
      }
      main {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
      }
      .crumb {
        font-size: 13px;
        color: var(--mute);
      }
      .crumb a {
        color: inherit;
        text-decoration: none;
      }
      h1 {
        font-size: 30px;
        margin: 8px 0 4px;
        letter-spacing: -0.8px;
      }
      .sub {
        color: var(--mute);
        margin: 0 0 18px;
        font-size: 14px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 18px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--chip);
        color: var(--ink);
        padding: 8px 14px;
        border-radius: 99px;
        font: 500 13px Inter;
        cursor: pointer;
        transition: 0.2s;
      }
      .chip[aria-pressed="true"] {
        background: var(--acc);
        border-color: var(--acc);
        color: #fff;
      }
      select {
        margin-left: auto;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font: 500 13px Inter;
      }
      .count {
        font-size: 13px;
        color: var(--mute);
        margin-bottom: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
        opacity: 0;
        transform: translateY(10px);
        animation: in 0.45s forwards;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 28px rgba(20, 33, 61, 0.14);
      }
      @keyframes in {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .img {
        aspect-ratio: 1/1;
        background: linear-gradient(135deg, var(--acc2), var(--chip));
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s;
      }
      .card:hover .img img {
        transform: scale(1.05);
      }
      .ph {
        font-size: 46px;
        position: absolute;
      }
      .tag {
        position: absolute;
        top: 10px;
        left: 10px;
        font: 700 11px Inter;
        padding: 4px 9px;
        border-radius: 99px;
        background: var(--acc);
        color: #fff;
        z-index: 1;
      }
      .tag.New {
        background: #2563eb;
      }
      .tag.Vote {
        background: #7c3aed;
      }
      .heart {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 1;
        border: 0;
        background: var(--card);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 16px;
        color: var(--mute);
        transition: 0.2s;
      }
      .heart.on {
        color: #e11d48;
        transform: scale(1.12);
      }
      .oos .img img {
        filter: grayscale(1);
        opacity: 0.55;
      }
      .body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }
      .nm {
        font-weight: 600;
        font-size: 15px;
        line-height: 1.3;
        min-height: 40px;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--mute);
      }
      .rt {
        background: var(--ok);
        color: #fff;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 6px;
      }
      .price {
        font-size: 20px;
        font-weight: 800;
      }
      .price small {
        font-size: 12px;
        font-weight: 500;
        color: var(--mute);
      }
      .btn {
        margin-top: auto;
        border: 0;
        border-radius: 10px;
        padding: 11px;
        font: 700 14px Inter;
        background: var(--acc);
        color: #fff;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.o {
        background: var(--chip);
        color: var(--ink);
      }
      .btn.v {
        background: #7c3aed;
      }
      .empty {
        padding: 60px;
        text-align: center;
        color: var(--mute);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 40px);
        background: var(--ink);
        color: var(--bg);
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 14px;
        opacity: 0;
        transition: 0.3s;
        z-index: 9;
      }
      #toast.s {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .city {
          display: none;
        }
        h1 {
          font-size: 24px;
        }
        select {
          margin-left: 0;
        }
        .body {
          padding: 10px;
        }
        .nm {
          font-size: 13px;
        }
      }
    </style>

  <div class="body"><div class="nm">${p.name}</div>
  <div class="meta">${p.rating ? `<span class="rt">★ ${p.rating}</span>` : "<span>No ratings yet</span>"}<span>${v ? "" : p.booked_count.toLocaleString("en-IN") + " booked"}</span></div>
  <div class="price">₹${p.per_day_rent}<small> / day</small></div>${btn}</div></article>`;
              })
              .join("")
          : `<div class="empty">No products match. Try clearing filters.</div>`;
      }
      $("#chips").onclick = (e) => {
        const b = e.target.closest(".chip");
        if (!b) return;
        const k = b.dataset.k;
        if (k === "stock") {
          f.stock = !f.stock;
          b.setAttribute("aria-pressed", f.stock);
        } else {
          f.tag = k;
          document
            .querySelectorAll(".chip")
            .forEach(
              (c) =>
                c.dataset.k !== "stock" &&
                c.setAttribute("aria-pressed", c === b),
            );
        }
        render();
      };
      $("#so").onchange = (e) => {
        f.sort = e.target.value;
        render();
      };
      $("#q").oninput = (e) => {
        f.q = e.target.value.toLowerCase().trim();
        render();
      };
      $("#grid").onclick = (e) => {
        const b = e.target.closest("[data-a]");
        if (!b) return;
        const id = +b.closest(".card").dataset.id,
          a = b.dataset.a;
        if (a === "fav") {
          f.fav.has(id) ? f.fav.delete(id) : f.fav.add(id);
          b.classList.toggle("on");
          b.textContent = f.fav.has(id) ? "♥" : "♡";
        } else
          toast(
            {
              rent: "Added to cart",
              notify: "We'll notify you when it's back",
              vote: "Thanks for voting!",
            }[a],
          );
      };
      $("#th").onclick = () => {
        const r = document.documentElement,
          d =
            r.dataset.theme === "dark" ||
            (!r.dataset.theme &&
              matchMedia("(prefers-color-scheme:dark)").matches);
        r.dataset.theme = d ? "light" : "dark";
      };
      render();
    </script>
  </body>
</html>
